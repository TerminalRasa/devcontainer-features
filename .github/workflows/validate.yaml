name: 'Validate devcontainer-feature.json files'
on:
  workflow_dispatch:
  pull_request:

jobs:
  validate:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@v1

      - name: 'Validate devcontainer-feature.json files'
        uses: devcontainers/action@v1
        with:
          validate-only: 'true'
          base-path-to-features: './src'
